<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f8;--card:#fff;--ink:#14213d;--muted:#6b7689;--line:#e3e7ee;
  --navy:#1b2a4a;--steel:#8a97ab;--accent:#e07a1f;--accent-soft:#fdf0e3;
  --green:#1f9d6b;--green-soft:#e3f6ee;--red:#d6453d;--red-soft:#fdeaea;
  --amber:#c98a06;--amber-soft:#fdf4dd;--blue:#2f6fde;--blue-soft:#e8f0fd;
  --r:14px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 110px}
header{background:linear-gradient(135deg,#1b2a4a,#2c3f66);color:#fff;padding:18px 16px 22px}
header .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(145deg,#d9dee6,#9aa6b8);display:grid;place-items:center;color:#1b2a4a;font-weight:800;font-size:13px;letter-spacing:.5px;box-shadow:inset 0 1px 0 #fff8}
header h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.2px}
header .sub{font-size:12.5px;opacity:.75;margin-top:2px}
.sync{margin-left:auto;font-size:11.5px;padding:5px 9px;border-radius:999px;background:#ffffff1f;white-space:nowrap}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;max-width:760px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:9px 2px 10px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-weight:600}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent)}
.fab{position:fixed;right:18px;bottom:78px;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 8px 20px #e07a1f55;cursor:pointer;z-index:21;line-height:1}
h2{font-size:16px;margin:22px 2px 10px;font-weight:800;display:flex;align-items:center;gap:8px}
h2 .cnt{font-size:12px;background:var(--line);color:var(--muted);padding:2px 8px;border-radius:999px;font-weight:700}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);padding:14px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:24px;font-weight:800;margin-top:4px;letter-spacing:-.5px}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.prog{height:7px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:9px}
.list{display:flex;flex-direction:column;gap:9px}
.lead{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;cursor:pointer;display:flex;gap:11px;align-items:flex-start}
.lead:active{background:#fafbfc}
.av{width:38px;height:38px;flex:none;border-radius:10px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:800;font-size:13px}
.lead .t{font-weight:700;font-size:14.5px;line-height:1.25}
.lead .m{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.lead .r{margin-left:auto;text-align:right;display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex:none}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.fu{font-size:11.5px;font-weight:600;color:var(--muted)}
.fu.late{color:var(--red)}.fu.today{color:var(--amber)}
.empty{text-align:center;color:var(--muted);padding:26px 14px;font-size:13.5px;background:#fff;border:1px dashed var(--line);border-radius:var(--r)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;margin:14px 0 10px;outline:none}
.search:focus,.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent)}
.funnel .row{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.funnel .row .n{width:92px;color:var(--muted);font-weight:600;flex:none}
.funnel .bar{flex:1;height:20px;background:#f0f2f6;border-radius:6px;overflow:hidden}
.funnel .bar i{display:block;height:100%;border-radius:6px}
.funnel .row b{width:28px;text-align:right}
/* pipeline */
.board{display:flex;gap:10px;overflow-x:auto;padding:14px 2px 10px;scroll-snap-type:x mandatory}
.col{min-width:250px;max-width:250px;background:#e9edf3;border-radius:var(--r);padding:10px;scroll-snap-align:start;flex:none}
.col h3{margin:2px 4px 10px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.col .pc{background:#fff;border-radius:11px;padding:10px;margin-bottom:8px;border:1px solid var(--line)}
.col .pc .t{font-weight:700;font-size:13.5px;cursor:pointer}
.col .pc .m{font-size:12px;color:var(--muted);margin:3px 0 8px}
.mv{display:flex;gap:6px}
.mv button{flex:1;border:1px solid var(--line);background:#f7f8fa;border-radius:8px;padding:5px;font-size:12px;cursor:pointer;font-weight:700;color:var(--muted)}
/* activity */
.act{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;display:flex;gap:11px}
.act .ic{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;font-size:16px;background:var(--accent-soft)}
.act .t{font-weight:700;font-size:13.5px}
.act .m{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.45;white-space:pre-wrap}
.dayh{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:16px 4px 7px}
/* modal */
.ov{position:fixed;inset:0;background:#0d152a80;z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:#fff;width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px 26px;animation:up .2s ease}
@media(min-width:780px){.ov{align-items:center}.sheet{border-radius:20px;max-height:88vh}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 14px;font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
.x{border:0;background:#f0f2f6;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px 10px}
.f label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--muted)}
.f label.full{grid-column:1/-1}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#fbfcfd;outline:none;font-weight:500;color:var(--ink);width:100%}
.f textarea{min-height:76px;resize:vertical}
.sec{grid-column:1/-1;font-size:12px;font-weight:800;color:var(--navy);margin-top:6px;padding-top:10px;border-top:1px solid var(--line);text-transform:uppercase;letter-spacing:.5px}
.btns{display:flex;gap:9px;margin-top:16px}
.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:700;cursor:pointer;background:#eef1f5;color:var(--ink)}
.btn.p{background:var(--accent);color:#fff;flex:1}
.btn.d{background:var(--red-soft);color:var(--red)}
.btn.n{background:var(--navy);color:#fff}
.btn.sm{padding:8px 12px;font-size:13px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:7px 10px;font-size:13.5px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;font-weight:600;word-break:break-word}
.qa{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.qa a,.qa button{text-decoration:none;font-size:13px;font-weight:700;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.qa a.wa{background:#e6f7ee;border-color:#c5ebd6;color:#13804f}
.stagepick{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.stagepick button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted)}
textarea.rep{width:100%;min-height:300px;border:1px solid var(--line);border-radius:12px;padding:12px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.5;background:#fbfcfd}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.tip{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:8px}
.hello{margin-top:16px;font-size:13.5px;color:var(--muted)}
.hello b{color:var(--ink);font-size:17px;display:block;margin-bottom:2px}
.chart{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 12px 10px}
.chart svg{width:100%;height:auto;display:block}
.chart .cap{font-size:12px;color:var(--muted);margin:0 2px 8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--muted);margin:8px 2px 0;font-weight:600}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.score{display:flex;gap:16px;align-items:center}
.ring{flex:none}
.metric{margin:11px 0}
.metric .top{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.metric .top span:last-child{color:var(--muted);font-weight:700}
.metric .prog{height:8px}
.grade{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;display:inline-block;margin-top:6px}
/* meeting mode */
#meet{position:fixed;inset:0;background:#0b1222;z-index:80;display:none;flex-direction:column;color:#fff}
#meet.show{display:flex}
#meet .mtop{display:flex;align-items:center;gap:8px;padding:10px 12px;justify-content:space-between}
#meet .chip{background:#ffffff14;border-color:#ffffff22;color:#cdd5e3}
#meet .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mstage{flex:1;display:flex;align-items:center;justify-content:center;padding:4px 10px;min-height:0}
.stage{width:100%;aspect-ratio:16/9;container-type:inline-size;position:relative;flex:none}
.sprog{position:absolute;left:0;right:0;bottom:0;height:.45cqw;background:#0000000f;border-radius:0 0 1.2cqw 1.2cqw;overflow:hidden;z-index:2}.sprog i{display:block;height:100%;background:#e07a1f;transition:width .25s}
#meet .fsbtn{background:#ffffff18;border:0;color:#fff;height:32px;padding:0 12px;border-radius:9px;font-weight:700;font-size:12.5px;cursor:pointer;margin-left:auto;margin-right:8px;white-space:nowrap}
/* desktop: kontrol melayang & auto-hide, slide penuh */
#meet.desk .mtop,#meet.desk .mbar{position:absolute;left:0;right:0;z-index:5;transition:opacity .3s}
#meet.desk .mtop{top:0;background:linear-gradient(#0b1222ee,#0b122200);padding:12px 16px 26px}
#meet.desk .mbar{bottom:0;background:linear-gradient(#0b122200,#0b1222ee);padding:26px 0 14px}
#meet.desk .mstage{position:absolute;inset:0;padding:14px}
#meet.desk .mhint{display:none}
#meet.desk.idle .mtop,#meet.desk.idle .mbar{opacity:0;pointer-events:none}
#meet.desk.idle{cursor:none}
.sl .sb{display:flex;flex-direction:column}
.mk{flex:1;grid-auto-rows:1fr}
.mk>div{display:flex;flex-direction:column;justify-content:center}
.mk .v{font-size:4.8cqw}
.mbar{display:flex;justify-content:center;align-items:center;gap:18px;padding:8px 0 4px;font-size:13px;color:#aab4c5}
.mbar button{background:#ffffff18;border:0;color:#fff;width:44px;height:36px;border-radius:10px;font-size:15px;cursor:pointer}
.mhint{text-align:center;font-size:11px;color:#6f7b90;padding:0 0 10px}
@media (orientation:landscape) and (max-height:500px){.mhint{display:none}#meet .mtop{padding:4px 10px}#meet .mbar{padding:4px 0}}
.sl{position:absolute;inset:0;background:#fff;color:#14213d;border-radius:1.2cqw;overflow:hidden;display:flex;flex-direction:column;font-size:1.75cqw;box-shadow:0 2cqw 5cqw #0006}
.sl .sh{padding:2.6cqw 3.5cqw 1.4cqw;border-bottom:.25cqw solid #f0f2f6;display:flex;align-items:flex-end;justify-content:space-between;gap:2cqw}
.sl .kick{font-size:1.25cqw;font-weight:800;color:#e07a1f;letter-spacing:.15cqw;text-transform:uppercase}
.sl h1{margin:.3cqw 0 0;font-size:3.1cqw;font-weight:800;letter-spacing:-.05cqw;line-height:1.1}
.sl .sb{flex:1;padding:2cqw 3.5cqw;min-height:0;overflow:hidden}
.sl .sf{padding:1cqw 3.5cqw;font-size:1.15cqw;color:#8a97ab;display:flex;justify-content:space-between;border-top:.15cqw solid #f0f2f6}
.sl.cover{background:linear-gradient(135deg,#1b2a4a 0%,#2c3f66 60%,#3b5283 100%);color:#fff;justify-content:center;padding:0 6cqw}
.sl.cover .big{font-size:5.4cqw;font-weight:800;line-height:1.05;letter-spacing:-.1cqw}
.sl.cover .bar{width:9cqw;height:.7cqw;background:#e07a1f;border-radius:1cqw;margin:2.4cqw 0}
.sl.cover .meta{font-size:1.9cqw;opacity:.85;line-height:1.6}
.sl.cover .lg{position:absolute;right:5cqw;top:4.5cqw;width:7cqw;height:7cqw;border-radius:1.6cqw;background:linear-gradient(145deg,#d9dee6,#9aa6b8);color:#1b2a4a;display:grid;place-items:center;font-weight:800;font-size:2cqw}
.mk{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4cqw}
.mk>div{background:#f5f7fa;border-radius:1cqw;padding:1.6cqw 1.8cqw}
.mk .l{font-size:1.3cqw;color:#6b7689;font-weight:700}
.mk .v{font-size:3.6cqw;font-weight:800;margin-top:.4cqw;letter-spacing:-.1cqw}
.mk .v small{font-size:1.6cqw;color:#8a97ab;font-weight:700}
.mk .pb{height:.7cqw;background:#e3e7ee;border-radius:1cqw;margin-top:.8cqw;overflow:hidden}.mk .pb i{display:block;height:100%;border-radius:1cqw}
.srow{display:flex;gap:1.4cqw;align-items:center;padding:.85cqw 0;border-bottom:.12cqw solid #f0f2f6}
.srow .ic{width:3.2cqw;height:3.2cqw;flex:none;border-radius:.8cqw;background:#fdf0e3;display:grid;place-items:center;font-size:1.6cqw}
.srow .c{font-weight:800;white-space:nowrap}
.srow .d{color:#6b7689;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.srow .bd{font-size:1.15cqw;font-weight:800;padding:.3cqw .9cqw;border-radius:2cqw;white-space:nowrap}
.sbar{display:flex;align-items:center;gap:1.4cqw;margin:.75cqw 0}
.sbar .n{width:15cqw;font-weight:700;color:#4a5568;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar .b{flex:1;height:2.3cqw;background:#f0f2f6;border-radius:.6cqw;overflow:hidden}.sbar .b i{display:block;height:100%;border-radius:.6cqw}
.sbar b{min-width:9cqw;text-align:right}
.two{display:grid;grid-template-columns:1fr 1fr;gap:3cqw;height:100%}
.two>div{min-width:0}
.sub{font-size:1.35cqw;font-weight:800;color:#8a97ab;text-transform:uppercase;letter-spacing:.1cqw;margin-bottom:.6cqw}
.note{background:#f5f7fa;border-radius:1cqw;padding:1.6cqw 1.8cqw;white-space:pre-wrap;line-height:1.5;height:calc(100% - 3cqw);overflow:hidden}
.sempty{color:#8a97ab;padding:1.5cqw 0}
.subnav{position:sticky;top:0;z-index:15;background:var(--bg);border-bottom:1px solid var(--line)}
.subnav .in{max-width:760px;margin:0 auto;padding:9px 14px 8px}
.subnav .chips{padding:0;scroll-behavior:smooth}
.lesson{font-size:14px;line-height:1.65}.lesson h4{margin:16px 0 4px;font-size:14.5px;color:var(--navy)}.lesson ul,.lesson ol{padding-left:20px;margin:6px 0}.lesson li{margin:3px 0}.lesson p{margin:6px 0}
.callout{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:13px;line-height:1.5}
table.comp{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0 6px}table.comp td{padding:6px 8px;border-bottom:1px solid var(--line)}table.comp tr:nth-child(odd){background:#fafbfc}table.comp td:first-child{width:60px}
.gsec{font-size:13px;line-height:1.5;margin-top:7px;background:#f7f8fa;border-radius:9px;padding:8px 10px}
details.obj summary{cursor:pointer;font-size:14px;list-style:none}details.obj summary::after{content:' ▾';color:var(--muted)}details.obj[open] summary::after{content:' ▴'}details.obj ul{margin:10px 0 0;padding-left:20px;font-size:13.5px;line-height:1.55}details.obj li{margin:4px 0}
.qopts{display:flex;flex-direction:column;gap:8px;margin-top:14px}.qopt{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:12px 13px;font-weight:600;cursor:pointer}.qopt:disabled{cursor:default}.qopt.right{border-color:var(--green);background:var(--green-soft);color:#13704b}.qopt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;padding:6px 0;cursor:pointer}.chk input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--green);flex:none}
.crow{display:flex;gap:6px;margin-bottom:6px;align-items:center}.crow input{border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fbfcfd;outline:none;min-width:0}.crow .ce{width:80px;flex:none;font-weight:700}.crow .cv{flex:1}
#login{position:fixed;inset:0;z-index:100;background:#0d152a;display:flex;align-items:center;justify-content:center;padding:18px 18px 110px;overflow:auto}
#login .lbg{position:fixed;inset:0;overflow:hidden}
#login .lbs{position:absolute;inset:-6%;background-size:cover;opacity:0;transition:opacity 1.8s ease;animation:lkb 16s ease-in-out infinite alternate;will-change:transform,opacity}
#login .lbs:nth-child(2){animation-name:lkb2}
#login .lbs.on{opacity:1}
@keyframes lkb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.12) translate(-2.5%,-1.5%)}}
@keyframes lkb2{from{transform:scale(1.12) translate(2%,1%)}to{transform:scale(1) translate(0,0)}}
#login .lbg::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(13,21,42,.15),rgba(13,21,42,.55) 70%),linear-gradient(180deg,rgba(13,21,42,.25) 0%,rgba(13,21,42,.35) 45%,rgba(13,21,42,.9) 100%)}
#login .lcap{position:fixed;left:0;right:0;bottom:0;z-index:1;padding:18px 22px calc(18px + env(safe-area-inset-bottom));color:#fff;text-align:center;pointer-events:none}
#login .lcap-k{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:#f4a35a;font-weight:800}
#login .lcap-n{font-size:17px;font-weight:800;margin-top:4px;text-shadow:0 2px 12px #0008;transition:opacity .6s}
#login .ldots{display:flex;gap:6px;justify-content:center;margin-top:10px}
#login .ldots i{width:7px;height:7px;border-radius:9px;background:#ffffff55;transition:all .4s}
#login .ldots i.on{width:22px;background:#e07a1f}
#login .lbox{position:relative;z-index:2;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);border:1px solid rgba(255,255,255,.6);animation:lin .6s cubic-bezier(.2,.8,.2,1)}
@keyframes lin{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@media(min-width:900px){#login .lcap{text-align:left;padding:28px 40px}#login .ldots{justify-content:flex-start}#login .lcap-n{font-size:22px}#login{padding-bottom:18px}}
@media (prefers-reduced-motion:reduce){#login .lbs{animation:none}}
#login[hidden]{display:none}
#login .lbox{border-radius:20px;padding:26px 22px 20px;width:100%;max-width:380px;box-shadow:0 20px 50px #0005}
#login .lglink{color:var(--blue);font-weight:700;text-decoration:none}
.acct{border:0;background:#ffffff1f;color:#fff;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.logo{flex:none}
.logo.has-ph{border-radius:50%;background:#fff;padding:2px;box-shadow:0 0 0 2px #e07a1f}
.ph-prev{width:72px;height:72px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:26px;overflow:hidden;flex:none;box-shadow:0 0 0 3px var(--accent-soft)}
.ph-prev img{width:100%;height:100%;object-fit:cover}
.warn{background:var(--amber-soft);color:#7a5400;border-radius:12px;padding:10px 12px;font-size:12.5px;margin-top:12px;display:none}
</style>

<script>
/* ---------- constants ---------- */
const STAGES=[
  {k:'baru',n:'Lead Baru',c:'#6b7689',bg:'#eef0f4'},
  {k:'dihubungi',n:'Dihubungi',c:'#2f6fde',bg:'#e8f0fd'},
  {k:'kualifikasi',n:'Kualifikasi',c:'#6c4fd8',bg:'#efebfc'},
  {k:'sampel',n:'Sampel / Uji',c:'#0f8a99',bg:'#e2f5f7'},
  {k:'penawaran',n:'Penawaran',c:'#c98a06',bg:'#fdf4dd'},
  {k:'negosiasi',n:'Negosiasi',c:'#e07a1f',bg:'#fdf0e3'},
  {k:'deal',n:'Deal / PO',c:'#1f9d6b',bg:'#e3f6ee'},
  {k:'gagal',n:'Gagal / Batal',c:'#d6453d',bg:'#fdeaea'}];
const SM=Object.fromEntries(STAGES.map(s=>[s.k,s]));
const ACTIVE=['baru','dihubungi','kualifikasi','sampel','penawaran','negosiasi'];
const PRIO={hot:{n:'Hot',c:'#d6453d'},warm:{n:'Warm',c:'#e07a1f'},cold:{n:'Cold',c:'#8a97ab'}};
const ATYPES=[['kunjungan','Kunjungan','🚗'],['telepon','Telepon','📞'],['wa','WhatsApp','💬'],['email','Email','✉️'],['meeting','Meeting','🤝'],['sampel','Kirim Sampel','📦'],['penawaran','Kirim Penawaran','📄'],['lain','Lainnya','📝']];
const AM=Object.fromEntries(ATYPES.map(a=>[a[0],{n:a[1],i:a[2]}]));
const SOURCES=['Kunjungan langsung','Referensi / rekomendasi','Database perusahaan','Pameran / event','Online / website','Cold call','Dari atasan / SPV','Lainnya'];

/* ---------- state & storage ---------- */
const DEFCFG={name:'',spv:'',tAct:5,tVisit:10,tLeads:20,tTon:50,evKendala:'',evRencana:''};
let S={leads:{},acts:{},notes:{},prods:{},cfg:Object.assign({},DEFCFG)};
let mode='local', cols=null, view='home', fStage='aktif', fQ='', fPrio='', actFilter='all', repPeriod='hari', evPeriod='bulan';
let meet={on:false,i:0,mode:'harian',n:0};
const ORD=STAGES.map(s=>s.k).filter(k=>k!=='gagal');
const ACOL={kunjungan:'#e07a1f',telepon:'#2f6fde',wa:'#1f9d6b',email:'#6c4fd8',meeting:'#1b2a4a',sampel:'#0f8a99',penawaran:'#c98a06',lain:'#a3adbd'};
function bumpMax(l){const i=ORD.indexOf(l.stage),m=ORD.indexOf(l.maxStage);if(i>m)l.maxStage=l.stage;else if(m<0)l.maxStage='baru';return l}
const LK='gan_sales_hub_v1';
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LK)||'null');if(j){S.leads=j.leads||{};S.acts=j.acts||{};S.notes=j.notes||{};S.prods=j.prods||{};S.cfg=Object.assign(S.cfg,j.cfg||{});}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LK,JSON.stringify(S));}catch(e){}}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
async function putLead(l){bumpMax(l);S.leads[l.id]=l;render();if(mode==='db'){try{await cols.leads.doc(l.id).set(l)}catch(e){fail(e)}}else{saveLocal();if(mode==='sheet')enqueue({action:'upsertLead',id:l.id,item:packLead(l)})}}
async function delLead(id){delete S.leads[id];render();if(mode==='db'){try{await cols.leads.doc(id).delete()}catch(e){fail(e)}}else{saveLocal();if(mode==='sheet')enqueue({action:'deleteLead',id})}}
async function putAct(a){S.acts[a.id]=a;render();if(mode==='db'){try{await cols.acts.doc(a.id).set(a)}catch(e){fail(e)}}else{saveLocal();if(mode==='sheet')enqueue({action:'upsertAct',id:a.id,item:packAct(a)})}}
async function delAct(id){delete S.acts[id];render();if(mode==='db'){try{await cols.acts.doc(id).delete()}catch(e){fail(e)}}else{saveLocal();if(mode==='sheet')enqueue({action:'deleteAct',id})}}
async function putNote(n){S.notes[n.id]=n;render();if(mode==='db'){try{await cols.notes.doc(n.id).set(n)}catch(e){fail(e)}}else{saveLocal();if(mode==='sheet')enqueue({action:'upsertNote',id:n.id,item:packNote(n)})}}
async function putProd(n){S.prods[n.id]=n;render();if(mode==='db'){try{await cols.prods.doc(n.id).set(n)}catch(e){fail(e)}}else{saveLocal();if(mode==='sheet')enqueue({action:'upsertProd',id:n.id,item:packProd(n)})}}
async function delProd(id){delete S.prods[id];render();if(mode==='db'){try{await cols.prods.doc(id).delete()}catch(e){fail(e)}}else{saveLocal();if(mode==='sheet')enqueue({action:'deleteProd',id})}}
async function putProdsBulk(arr){arr.forEach(n=>S.prods[n.id]=n);render();if(mode==='db'){try{for(const n of arr)await cols.prods.doc(n.id).set(n)}catch(e){fail(e)}}else{saveLocal();if(mode==='sheet')enqueue({action:'bulk',id:'bulkP'+Date.now(),leads:[],acts:[],prods:arr.map(packProd)})}}
async function delNote(id){delete S.notes[id];render();if(mode==='db'){try{await cols.notes.doc(id).delete()}catch(e){fail(e)}}else{saveLocal();if(mode==='sheet')enqueue({action:'deleteNote',id})}}
async function putCfg(c){if(JSON.stringify(c).length>45000)toast('⚠️ Catatan/goals sudah sangat panjang — ringkas catatan agar tetap tersimpan ke Sheet.');S.cfg=c;render();if(mode==='db'){try{await cols.base.set({cfg:c})}catch(e){fail(e)}}else{saveLocal();if(mode==='sheet')enqueue({action:'saveCfg',id:'cfg',cfg:c})}}

/* ---------- Google Sheet sync ---------- */
const SHK='shub_sheet',OBK='shub_outbox';
const EXEC_URL='https://script.google.com/macros/s/AKfycbyQEG73KEHOA6aly3l7EiOur0ks2bBqf_ewgsVYoxU7YeXIUGx4YzWzidp4PmnHaEvUow/exec';const HOSTED=/^https:/.test(EXEC_URL);
let SH=null,outbox=[],flushing=false,oldGs=false;
try{SH=JSON.parse(localStorage.getItem(SHK)||'null')}catch(e){}
try{outbox=JSON.parse(localStorage.getItem(OBK)||'[]')}catch(e){}
function saveOutbox(){try{localStorage.setItem(OBK,JSON.stringify(outbox))}catch(e){}}
function vv(v){return v==null?'':v}
function packLead(l){
  const O=l.orders||[];
  const row=[l.id,l.company,l.industry,l.city,l.address,l.pic,l.role,l.phone,l.email,l.product,num(l.vol)||'',rp(l.price)||'',l.supplier,l.terms,l.source,(SM[l.stage]||{}).n,(PRIO[l.prio]||{}).n,l.nextFU,l.nextAction,l.lostReason,
    QUAL.filter(([k])=>(l.qual||{})[k]).length+'/'+QUAL.length,O.reduce((s,o)=>s+num(o.ton),0)||'',O.reduce((s,o)=>s+ordVal(o),0)||'',l.created,l.updated,S.cfg.name].map(vv);
  const c=l.company||'';
  return {id:l.id,row,json:JSON.stringify(l),details:{
    Kontak:(l.contacts||[]).map(x=>[l.id,c,x.name,DMU[x.dmu]||'',x.role,x.phone,x.email].map(vv)),
    Penawaran:(l.quotes||[]).map(x=>[l.id,c,x.date,x.valid,x.grade,num(x.vol)||'',rp(x.price)||'',num(x.vol)*1000*rp(x.price)||'',(QST[x.status]||[''])[0],x.note].map(vv)),
    Sampel:(l.samples||[]).map(x=>[l.id,c,x.date,x.grade,num(x.qty)||'',(SST[x.result]||[''])[0],x.resultDate,x.note].map(vv)),
    PO:(l.orders||[]).map(x=>[l.id,c,x.date,x.poNo,x.grade,num(x.ton)||'',rp(x.price)||'',ordVal(x)||'',(OST[x.status]||[''])[0],x.delivery,x.due,x.note].map(vv))}}}
function packNote(n){return {id:n.id,json:JSON.stringify(n),row:[n.id,n.date,n.topic,n.title,n.learned,n.source,n.question,n.apply,n.score,S.cfg.name].map(vv)}}
function packProd(g){return {id:g.id,json:JSON.stringify(g),row:[g.id,g.name,g.cat,g.std,g.eq,(g.comp||[]).map(([e,v])=>e+' '+v).join('; '),g.s,g.a,g.tip,g.note,(g.updated||'').slice(0,10)].map(vv)}}
function packAct(a){const l=S.leads[a.leadId];return {id:a.id,json:JSON.stringify(a),row:[a.id,a.date,(AM[a.type]||AM.lain).n,l?l.company:a.leadName,a.result,a.nextFU,S.cfg.name].map(vv)}}
function authBody(){return SH?{key:SH.key,token:SH.token}:{}}
function saveSH(){try{if(SH)localStorage.setItem(SHK,JSON.stringify(SH));else localStorage.removeItem(SHK)}catch(e){}}
function authErr(j){const e=new Error(j.error||'Gagal');if(j.auth)e.auth=true;return e}
async function rawPost(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});return await r.json()}
async function api(body){const j=await rawPost(SH.url,Object.assign(authBody(),body));if(!j.ok)throw authErr(j);return j}
async function apiGet(){const a=authBody(),u=SH.url;const r=await fetch(u+(u.includes('?')?'&':'?')+'action=all'+(a.token?'&token='+encodeURIComponent(a.token):'')+(a.key?'&key='+encodeURIComponent(a.key):''));const j=await r.json();if(!j.ok)throw authErr(j);return j}
function sessionOK(){return !!(SH&&SH.url&&SH.token&&SH.exp>Date.now())}
function enqueue(op){const st=flushing?1:0;const kind=op.action.slice(-3);outbox=outbox.filter((o,i)=>i<st||o.id!==op.id||o.action.slice(-3)!==kind);outbox.push(op);saveOutbox();flush()}
async function flush(){if(flushing||mode!=='sheet'||!outbox.length||!sessionOK())return;flushing=true;
  try{while(outbox.length){setSync('Menyimpan… '+outbox.length);try{await api(outbox[0])}catch(e){if(/tidak dikenal/i.test(e.message)){oldGs=true;outbox.shift();saveOutbox();continue}throw e}outbox.shift();saveOutbox()}if(oldGs)showWarn('Catatan belajar baru tersimpan di perangkat ini. Perbarui Code.gs (versi terbaru) agar ikut tersimpan ke Google Sheet.');setSync('✓ Tersinkron Sheet');if(!oldGs)hideWarn()}
  catch(e){if(e.auth){flushing=false;onAuthFail();return}setSync('⚠ '+outbox.length+' antre');showWarn('Belum terkirim ke Google Sheet ('+e.message+'). Data aman di HP ini & akan dikirim otomatis saat koneksi kembali.')}
  flushing=false}
function applyOutbox(L,A,N,P){N=N||{};P=P||{};outbox.forEach(o=>{
  if(o.action==='upsertProd')P[o.id]=JSON.parse(o.item.json);else if(o.action==='deleteProd')delete P[o.id];
  if(o.action==='upsertNote')N[o.id]=JSON.parse(o.item.json);else if(o.action==='deleteNote')delete N[o.id];
  if(o.action==='upsertLead')L[o.id]=JSON.parse(o.item.json);else if(o.action==='deleteLead')delete L[o.id];
  else if(o.action==='upsertAct')A[o.id]=JSON.parse(o.item.json);else if(o.action==='deleteAct')delete A[o.id];
  else if(o.action==='bulk'){(o.leads||[]).forEach(x=>L[x.id]=JSON.parse(x.json));(o.acts||[]).forEach(x=>A[x.id]=JSON.parse(x.json));(o.notes||[]).forEach(x=>N[x.id]=JSON.parse(x.json));(o.prods||[]).forEach(x=>P[x.id]=JSON.parse(x.json))}})}
async function pullSheet(silent){if(mode!=='sheet'||flushing||!sessionOK())return;
  try{const j=await apiGet();if(flushing)return;const L={},A={};
    (j.leads||[]).forEach(x=>{L[x.id]=x});(j.acts||[]).forEach(x=>{A[x.id]=x});
    let N=null;if(Array.isArray(j.notes)){N={};j.notes.forEach(x=>{N[x.id]=x})}else oldGs=true;
    const N2=N||Object.assign({},S.notes);
    let P2=Object.assign({},S.prods);if(Array.isArray(j.prods)){P2={};j.prods.forEach(x=>{P2[x.id]=x})}else oldGs=true;
    applyOutbox(L,A,N2,P2);
    S.leads=L;S.acts=A;S.notes=N2;S.prods=P2;if(j.cfg&&!outbox.some(o=>o.action==='saveCfg'))S.cfg=Object.assign({},DEFCFG,j.cfg);
    saveLocal();render();if(!outbox.length){setSync('✓ Tersinkron Sheet');hideWarn()}}
  catch(e){if(e.auth)return onAuthFail();setSync('⚠ Offline');if(!silent)showWarn('Tidak bisa memuat dari Google Sheet ('+e.message+'). Menampilkan data terakhir di perangkat ini.')}}
let sheetStarted=false;
function initSheet(){mode='sheet';$('#acctBtn').hidden=false;if(sheetStarted){loadLocal();render();pullSheet();return}sheetStarted=true;loadLocal();render();setSync('Menghubungkan…');
  flush().then(()=>pullSheet());
  setInterval(()=>{flush();pullSheet(true)},60000);
  window.addEventListener('online',()=>{flush();pullSheet(true)});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){flush();pullSheet(true)}})}
async function syncFirst(){
  setSync('Memuat…');let j;
  try{j=await apiGet()}catch(e){if(e.auth)return onAuthFail();setSync('⚠ Offline');showWarn('Gagal memuat dari Google Sheet: '+e.message);return}
  const nServer=(j.leads||[]).length,nLocal=Object.keys(S.leads).length;
  const go=async(upload)=>{
    if(upload){mode='sheet';setSync('Mengunggah…');try{await api({action:'bulk',leads:leadsArr().map(packLead),acts:Object.values(S.acts).map(packAct),notes:Object.values(S.notes).map(packNote),prods:Object.values(S.prods).map(packProd),cfg:S.cfg})}catch(e){toast('Unggah gagal: '+e.message);return}}
    else{S.leads={};S.acts={};S.notes={};(j.leads||[]).forEach(x=>S.leads[x.id]=x);(j.acts||[]).forEach(x=>S.acts[x.id]=x);(j.notes||[]).forEach(x=>S.notes[x.id]=x);if(Array.isArray(j.prods)&&j.prods.length){S.prods={};j.prods.forEach(x=>S.prods[x.id]=x)}if(j.cfg)S.cfg=Object.assign({},DEFCFG,j.cfg)}
    SH.synced=true;saveSH();outbox=[];saveOutbox();saveLocal();hideWarn();initSheet()};
  if(nLocal&&!nServer){openSheet(`<h3>Unggah data?<button class="x" data-close>✕</button></h3><div style="font-size:14px;line-height:1.5">Sheet masih kosong. Kirim <b>${nLocal} leads</b> & <b>${Object.keys(S.acts).length} aktivitas</b> yang ada di perangkat ini ke Google Sheet?</div><div class="btns"><button class="btn" id="cNo">Mulai kosong</button><button class="btn p" id="cYes">Ya, unggah</button></div>`);$('#cYes').onclick=()=>{closeSheet();go(true)};$('#cNo').onclick=()=>{closeSheet();go(false)}}
  else go(false)}
let pendingUrl='',lgMode='login';
function loginUrl(){return HOSTED?EXEC_URL:((SH&&SH.url)||pendingUrl)}
async function showLogin(msg){
  const ov=$('#login');ov.hidden=false;$('#lgErr').textContent=msg||'';
  try{$('#lgName').value=localStorage.getItem('shub_lastname')||''}catch(e){}
  setLg('login');
  try{const j=await rawPost(loginUrl(),{action:'hasUsers'});if(j.ok&&!j.has)setLg('setup')}catch(e){$('#lgErr').textContent='Tidak bisa terhubung ke server. Cek koneksi internet.'}
}
function setLg(m){lgMode=m;document.querySelectorAll('#login [data-lgm]').forEach(el=>el.hidden=!el.dataset.lgm.split(' ').includes(m));
  $('#lgTitle').textContent=m==='login'?'Masuk':m==='setup'?'Buat akun pertama':'Reset PIN';
  $('#lgBtn').textContent=m==='login'?'Masuk':m==='setup'?'Buat akun & masuk':'Reset PIN & masuk';$('#lgErr').textContent=''}
async function doLogin(){
  const url=loginUrl(),name=$('#lgName').value.trim(),pin=$('#lgPin').value.trim(),rem=$('#lgRem').checked,err=$('#lgErr');
  if(!name){err.textContent='Isi nama';return}if(!/^\d{4,6}$/.test(pin)){err.textContent='PIN harus 4–6 angka';return}
  let body={action:'login',name,pin,remember:rem};
  if(lgMode!=='login'){const key=$('#lgKey').value.trim();if(!key){err.textContent='Isi kode rahasia';return}
    if(lgMode==='setup'&&$('#lgPin2').value.trim()!==pin){err.textContent='Ulangi PIN tidak sama';return}
    body={action:lgMode==='setup'?'setupUser':'resetPin',key,name,pin,remember:rem}}
  const b=$('#lgBtn');b.disabled=true;b.textContent='Memeriksa…';err.textContent='';
  let j;try{j=await rawPost(url,body)}catch(e){j={ok:false,error:'Tidak bisa terhubung ke server.'}}
  b.disabled=false;setLg(lgMode);
  if(!j.ok){err.textContent=j.error||'Gagal masuk';return}
  const had=!!(SH&&(SH.key||SH.synced));
  SH={url,token:j.token,exp:j.exp,user:j.name,role:j.role,synced:had};saveSH();
  try{localStorage.setItem('shub_lastname',j.name)}catch(e){}
  $('#lgPin').value='';$('#lgPin2').value='';$('#lgKey').value='';$('#login').hidden=true;
  {const f=j.name.split(' ');toast('Selamat datang, '+(f[0].length<=3&&f[1]?f[0]+' '+f[1]:f[0])+' 👋')}
  if(!S.cfg.name)S.cfg.name=j.name;
  if(SH.synced)initSheet();else syncFirst()}
function onAuthFail(){if(SH){delete SH.token;delete SH.key;saveSH()}showLogin('Sesi berakhir, silakan masuk lagi.')}
function logout(){const pend=outbox.length;
  confirmBox((pend?`<b style="color:var(--red)">${pend} perubahan belum terkirim ke Sheet dan akan hilang.</b><br>`:'')+'Keluar dari Sales Hub di perangkat ini?',async()=>{
    closeSheet();try{await api({action:'logout'})}catch(e){}
    SH={url:SH.url,synced:false};saveSH();outbox=[];saveOutbox();try{localStorage.removeItem(LK)}catch(e){}
    S.leads={};S.acts={};S.notes={};S.prods={};S.cfg=Object.assign({},DEFCFG);render();setSync('Keluar');showLogin()});
  setTimeout(()=>{const b=$('#okC');if(b)b.textContent='Ya, keluar'},0)}
function acctMenu(){if(!sessionOK()){showLogin();return}
  openSheet(`<h3>Akun<button class="x" data-close>✕</button></h3>
  <div class="card" style="display:flex;gap:12px;align-items:center"><div class="av" style="width:46px;height:46px;font-size:16px">${esc(initials(SH.user))}</div><div><div style="font-weight:800;font-size:16px">${esc(SH.user)}</div><div class="tip" style="margin:2px 0 0">Peran: ${esc(SH.role||'sales')} · sesi berlaku s.d. ${fmtD(ds(new Date(SH.exp)))}</div></div></div>
  <div class="list" style="margin-top:12px"><button class="btn" id="chgPin">🔑 Ganti PIN</button><button class="btn" id="mgUsers">👥 Kelola pengguna</button><button class="btn d" id="logoutBtn">Keluar</button></div>`)}
function chgPinForm(){openSheet(`<h3>Ganti PIN<button class="x" data-close>✕</button></h3><div class="f">
  <label class="full">PIN lama<input id="cpOld" type="password" inputmode="numeric" maxlength="6"></label>
  <label>PIN baru (4–6 angka)<input id="cpNew" type="password" inputmode="numeric" maxlength="6"></label><label>Ulangi PIN baru<input id="cpNew2" type="password" inputmode="numeric" maxlength="6"></label></div>
  <div class="btns"><button class="btn p" id="cpSave">Simpan PIN baru</button></div>`);
  $('#cpSave').onclick=async()=>{const n=$('#cpNew').value.trim();if(!/^\d{4,6}$/.test(n)){toast('PIN baru harus 4–6 angka');return}if(n!==$('#cpNew2').value.trim()){toast('Ulangi PIN tidak sama');return}
    try{await api({action:'changePin',oldPin:$('#cpOld').value.trim(),newPin:n});closeSheet();toast('PIN berhasil diganti ✓')}catch(e){if(e.auth)return onAuthFail();toast(e.message)}}}
async function usersMgr(){openSheet(`<h3>Kelola pengguna<button class="x" data-close>✕</button></h3><div id="umList" class="list"><div class="tip">Memuat…</div></div>
  <h2>Tambah pengguna</h2><div class="card"><div class="f"><label class="full">Nama<input id="umName"></label><label>PIN awal (4–6 angka)<input id="umPin" inputmode="numeric" maxlength="6"></label>
  <label>Peran<select id="umRole"><option value="sales">Sales</option><option value="atasan">Atasan</option><option value="admin">Admin</option></select></label></div>

function cover(t1,t2,meta){return `<div class="sl cover"><div class="lg"><svg viewBox="0 0 24 24" style="width:55%;height:55%" fill="none" stroke="#1b2a4a" stroke-width="2" stroke-linejoin="round"><path d="M3 17l3-7h12l3 7z"/><path d="M6 10l2-4h8l2 4"/></svg></div><div class="kick" style="color:#f4a35a;font-size:1.6cqw">${t2}</div><div class="big">${t1}</div><div class="bar"></div><div class="meta">${meta}</div></div>`}
function tile(l,v,sub,p,col){return `<div><div class="l">${l}</div><div class="v">${v}${sub?` <small>${sub}</small>`:''}</div>${p!=null?`<div class="pb"><i style="width:${Math.min(100,p)}%;background:${col||(p>=100?'#1f9d6b':p>=60?'#e07a1f':'#d6453d')}"></i></div>`:''}</div>`}
function sRow(icon,company,desc,badgeHtml){return `<div class="srow"><div class="ic">${icon}</div><span class="c">${esc(company)}</span><span class="d">${esc(desc)}</span>${badgeHtml||''}</div>`}
function sBadge(k){const s=SM[k]||SM.baru;return `<span class="bd" style="color:${s.c};background:${s.bg}">${s.n}</span>`}
function sBars(items,suffix){const mx=Math.max(1,...items.map(i=>i.v));return items.map(i=>`<div class="sbar"><span class="n">${esc(i.l)}</span><div class="b"><i style="width:${i.v/mx*100}%;background:${i.c||'#e07a1f'}"></i></div><b>${i.t!=null?i.t:fmtN(i.v)+(suffix||'')}</b></div>`).join('')}
function listOrEmpty(rows,max,empty){if(!rows.length)return `<div class="sempty">${empty}</div>`;return rows.slice(0,max).join('')+(rows.length>max?`<div class="sempty">+${rows.length-max} lainnya</div>`:'')}
function topProspects(L){return L.filter(l=>ACTIVE.includes(l.stage)).sort((a,b)=>num(b.vol)-num(a.vol)||ORD.indexOf(b.stage)-ORD.indexOf(a.stage))}
function notesSlide(){return slide('Diskusi','Kendala & rencana',`<div class="two"><div><div class="sub">Kendala / butuh bantuan</div><div class="note">${esc(S.cfg.evKendala||'—\n(isi di tab Evaluasi → Catatan untuk atasan)')}</div></div><div><div class="sub">Rencana berikutnya</div><div class="note">${esc(S.cfg.evRencana||'—')}</div></div></div>`)}
function buildSlides(){
  if(meet.mode==='belajar')return learnSlides();
  const L=leadsArr(),t=TODAY(),c=S.cfg,out=[];
  const nm=esc(c.name||'Sales'),spv=c.spv?' · untuk '+esc(c.spv):'';
  if(meet.mode==='harian'){
    const pf=prevWork(),y=shift(t,-1);
    const prevA=actsArr().filter(a=>a.date>=pf&&a.date<=y).reverse();
    const todayA=actsArr().filter(a=>a.date===t).reverse();
    const act=L.filter(l=>ACTIVE.includes(l.stage));
    const late=act.filter(l=>l.nextFU&&l.nextFU<t).sort((a,b)=>a.nextFU.localeCompare(b.nextFU));
    const tod=act.filter(l=>l.nextFU===t);
    const vWeek=actsArr().filter(a=>a.date>=weekStart()&&a.type==='kunjungan').length;
    const dealsM=L.filter(l=>l.stage==='deal'&&(l.dealDate||'')>=monthStart());
    const tA=num(c.tAct)||5,tV=num(c.tVisit)||10;
    out.push(cover('Daily Meeting<br>Sales',`Laporan harian`,`${nm}${spv}<br>${fmtD(t,true)}`));
    out.push(slide('Ringkasan','Posisi hari ini',`<div class="mk">
      ${tile(pf===y?'Aktivitas kemarin':'Aktivitas '+fmtD(pf)+'–'+fmtD(y),prevA.length,'/ '+tA*Math.max(1,workdays(pf,y)),prevA.length/(tA*Math.max(1,workdays(pf,y)))*100)}
      ${tile('Kunjungan minggu ini',vWeek,'/ '+tV,vWeek/tV*100,'#2f6fde')}
      ${tile('Leads aktif',act.length,'perusahaan')}
      ${tile('Potensi volume',fmtN(act.reduce((s,l)=>s+num(l.vol),0)),'ton/bln · '+fmtRp(act.reduce((s,l)=>s+leadVal(l),0)))}
      ${tile('Deal bulan ini',dealsM.length,fmtN(dealsM.reduce((s,l)=>s+num(l.vol),0))+' ton/bln')}
      ${tile('Follow-up hari ini',tod.length+late.length,late.length?`<span style="color:#d6453d">${late.length} terlambat</span>`:'semua tepat waktu')}
    </div>`));
    out.push(slide('Hasil kerja',pf===y?'Aktivitas kemarin':'Aktivitas '+fmtD(pf)+' – '+fmtD(y),listOrEmpty(prevA.concat(todayA).map(a=>{const l=S.leads[a.leadId];return sRow((AM[a.type]||AM.lain).i,l?l.company:a.leadName,(a.date===t?'(hari ini) ':'')+(AM[a.type]||AM.lain).n+' — '+(a.result||''),l?sBadge(l.stage):'')}),8,'Belum ada aktivitas tercatat.'),`<div style="font-size:1.5cqw;color:#6b7689;font-weight:700">${prevA.length} aktivitas</div>`));
    out.push(slide('Rencana','Rencana hari ini',listOrEmpty(late.map(l=>sRow('⏰',l.company,`terlambat sejak ${fmtD(l.nextFU)}${l.nextAction?' — '+l.nextAction:''}`,sBadge(l.stage))).concat(tod.map(l=>sRow('📌',l.company,l.nextAction||'Follow-up',sBadge(l.stage)))),8,'Tidak ada follow-up terjadwal — fokus cari leads baru & kunjungan.'),`<div style="font-size:1.5cqw;color:#6b7689;font-weight:700">Target: ${tA} aktivitas</div>`));
    const al=alertsList();
    const oq=allQuotes().filter(q=>['terkirim','revisi'].includes(q.status)&&ACTIVE.includes(q.lead.stage)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    out.push(slide('Penawaran & tindak lanjut','Penawaran berjalan & perlu perhatian',`<div class="two"><div><div class="sub">Penawaran berjalan (${oq.length})</div>${listOrEmpty(oq.map(q=>sRow('📄',q.lead.company,`${q.grade||''} ${q.vol?q.vol+'t':''} @${rp(q.price).toLocaleString('id-ID')} · s.d. ${fmtD(q.valid)}`)),6,'Belum ada penawaran berjalan.')}</div><div><div class="sub">Perlu perhatian (${al.length})</div>${listOrEmpty(al.map(a=>sRow(a.i,a.l.company,a.m)),6,'Semua aman 👍')}</div></div>`));
  }else{
    const p=meet.mode==='mingguan'?'minggu':'bulan',d=evalFor(p),[gl,gn,gc,gb]=grade(d.score);
    out.push(cover(meet.mode==='mingguan'?'Evaluasi<br>Mingguan':'Evaluasi<br>Bulanan','Evaluasi kinerja sales',`${nm}${spv}<br>${fmtD(d.r.from)} – ${fmtD(d.r.end)}`));
    out.push(slide('Kinerja','Skor & pencapaian target',`<div class="two" style="grid-template-columns:1fr 2fr;align-items:center"><div style="text-align:center">${ring(d.score,gc).replace('width="92" height="92"','style="width:17cqw;height:17cqw"')}<div><span class="bd" style="font-size:1.6cqw;padding:.5cqw 1.4cqw;border-radius:3cqw;font-weight:800;color:${gc};background:${gb}">${gl} · ${gn}</span></div></div><div>${sBars(d.M.map(m=>({l:m.k,v:m.p,c:m.p>=100?'#1f9d6b':m.p>=60?'#e07a1f':'#d6453d',t:fmtN(m.v)+m.u+' / '+fmtN(m.t)+m.u})))}</div></div>`));
    let labels=[],keys=[];
    for(let s=d.r.from;s<=d.r.to;s=shift(s,1)){labels.push(p==='minggu'?HARI[pd(s).getDay()].slice(0,3):String(pd(s).getDate()));keys.push(s)}
    const used=ATYPES.filter(a=>d.A.some(x=>x.type===a[0]));
    const series=used.map(a=>({name:a[1],color:ACOL[a[0]],values:keys.map(k=>d.A.filter(v=>v.type===a[0]&&v.date===k).length)}));
    out.push(slide('Aktivitas','Aktivitas per hari',d.A.length?`<div style="height:29cqw">${stackSvg(labels,series).replace('<svg ','<svg style="width:100%;height:100%" ')}</div><div style="display:flex;gap:2.4cqw;flex-wrap:wrap;font-size:1.4cqw;font-weight:700;color:#4a5568;margin-top:.6cqw">${series.map(s=>`<span><i style="display:inline-block;width:1.2cqw;height:1.2cqw;border-radius:.3cqw;background:${s.color};margin-right:.6cqw"></i>${s.name} ${s.values.reduce((a,b)=>a+b,0)}</span>`).join('')}</div>`:'<div class="sempty">Belum ada aktivitas di periode ini.</div>',`<div style="font-size:1.5cqw;color:#6b7689;font-weight:700">Total ${d.A.length}</div>`));
    const tot=d.reached[0]||0;
    out.push(slide('Pipeline','Konversi pipeline',sBars(ORD.map((k,i)=>({l:SM[k].n,v:d.reached[i],c:SM[k].c,t:d.reached[i]+(tot?` · ${Math.round(d.reached[i]/tot*100)}%`:'')}))),d.winRate!=null?`<div style="font-size:1.6cqw;font-weight:800;color:#1f9d6b">Win rate ${Math.round(d.winRate)}%</div>`:''));
    out.push(slide('Prospek','Prospek utama & deal',`<div class="two"><div><div class="sub">Prospek terbesar (ton/bln)</div>${listOrEmpty(topProspects(L).map(l=>sRow('🏭',l.company,(l.product||'-')+(num(l.vol)?' · '+fmtN(num(l.vol))+' t':''),sBadge(l.stage))),6,'Belum ada prospek aktif.')}</div><div><div class="sub">Deal periode ini · ${fmtN(d.dealTon)} ton/bln</div>${listOrEmpty(d.deals.map(l=>sRow('🎉',l.company,(l.product||'-')+' · '+fmtN(num(l.vol))+' t')),6,'Belum ada deal di periode ini.')}</div></div>`));
    const ins=insights(d);const lostItems=groupBy(L.filter(l=>l.stage==='gagal'),l=>l.lostReason);
    out.push(slide('Analisis','Catatan & pembelajaran',`<div class="two"><div><div class="sub">Analisis</div>${ins.map(x=>`<div style="padding:.7cqw 0;border-bottom:.12cqw solid #f0f2f6;line-height:1.4">${esc(x)}</div>`).join('')}</div><div><div class="sub">Alasan lead gagal</div>${lostItems.length?sBars(lostItems.slice(0,6).map(x=>({l:x.l,v:x.v,c:'#d6453d'}))):'<div class="sempty">Belum ada lead gagal.</div>'}</div></div>`));
  }
  if(meet.mode==='harian'){
    const act=L.filter(l=>ACTIVE.includes(l.stage));
    out.push(slide('Pipeline','Status pipeline',sBars(STAGES.map(s=>{const c=L.filter(l=>l.stage===s.k);const v=c.reduce((x,l)=>x+num(l.vol),0);return {l:s.n,v:c.length,c:s.c,t:c.length+(v?' · '+fmtN(v)+' t':'')}})),`<div style="font-size:1.5cqw;color:#6b7689;font-weight:700">Potensi aktif ${fmtN(act.reduce((s,l)=>s+num(l.vol),0))} ton/bln</div>`));
    out.push(slide('Prospek','Prospek utama',listOrEmpty(topProspects(L).map(l=>sRow('🏭',l.company,[l.product,num(l.vol)?fmtN(num(l.vol))+' ton/bln':'',l.city].filter(Boolean).join(' · '),sBadge(l.stage))),7,'Belum ada prospek aktif.')));
  }
  const GG=goalsArr().filter(g=>!g.done||meet.mode!=='harian');
  if(GG.length)out.push(slide('Goals','Progres goals',sBars(GG.slice(0,7).map(g=>{const r=goalProg(g);return {l:g.title,v:r.p,c:r.p>=100?'#1f9d6b':r.st[0]==='Tertinggal'||r.st[0]==='Terlewat'?'#d6453d':'#e07a1f',t:Math.round(r.p)+'% · '+r.st[0].replace(/ 🎉/,'')}})),`<div style="font-size:1.5cqw;color:#6b7689;font-weight:700">${GG.filter(g=>goalProg(g).p>=100).length}/${GG.length} tercapai</div>`));
  out.push(notesSlide());
  return out;
}
function drawMeet(){const sl=buildSlides();meet.n=sl.length;meet.i=Math.max(0,Math.min(meet.i,sl.length-1));
  $('#mStage').innerHTML=sl[meet.i]+`<div class="sprog"><i style="width:${(meet.i+1)/sl.length*100}%"></i></div>`;$('#mNum').textContent=(meet.i+1)+' / '+sl.length;fitStage();
  document.querySelectorAll('[data-mm]').forEach(b=>b.classList.toggle('on',b.dataset.mm===meet.mode))}
function fitStage(){const box=document.querySelector('.mstage'),st=$('#mStage');if(!box||!meet.on)return;
  const cs=getComputedStyle(box),W=box.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),H=box.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  st.style.width=Math.max(200,Math.floor(Math.min(W,H*16/9)))+'px'}
window.addEventListener('resize',fitStage);
document.addEventListener('fullscreenchange',()=>{const f=!!document.fullscreenElement;$('#mFs').textContent=f?'⤢ Keluar layar penuh':'⛶ Layar penuh';setTimeout(fitStage,60)});
function isDesk(){try{return matchMedia('(pointer:fine)').matches&&innerWidth>=700}catch(e){return false}}
let idleT=null;function wake(){const m=$('#meet');m.classList.remove('idle');clearTimeout(idleT);if(m.classList.contains('desk'))idleT=setTimeout(()=>m.classList.add('idle'),2500)}
$('#meet').addEventListener('mousemove',wake);
async function toggleFs(){try{if(document.fullscreenElement){await document.exitFullscreen()}else{await $('#meet').requestFullscreen()}}catch(e){toast('Layar penuh diblokir di tampilan ini — buka Sales Hub di tab browser sendiri, lalu coba lagi.')}}
function openMeet(mode){meet.on=true;meet.mode=mode||'harian';meet.i=0;const m=$('#meet');m.classList.toggle('desk',isDesk());m.classList.add('show');drawMeet();wake();
  if(isDesk()){try{const r=m.requestFullscreen();if(r&&r.catch)r.catch(()=>{})}catch(e){}}}
function closeMeet(){meet.on=false;$('#meet').classList.remove('show');try{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(e){}}
function stepMeet(n){const j=meet.i+n;if(j<0||j>=meet.n)return;meet.i=j;drawMeet()}
$('#mFs').onclick=toggleFs;$('#mPrev').onclick=()=>stepMeet(-1);$('#mNext').onclick=()=>stepMeet(1);$('#mClose').onclick=closeMeet;
$('#mStage').addEventListener('click',e=>{const r=e.currentTarget.getBoundingClientRect();stepMeet(e.clientX-r.left<r.width*.3?-1:1)});
document.addEventListener('keydown',e=>{if(!meet.on)return;if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();stepMeet(1)}else if(e.key==='ArrowLeft'||e.key==='PageUp')stepMeet(-1);else if(e.key==='Escape'&&!document.fullscreenElement)closeMeet();else if(e.key==='f'||e.key==='F')toggleFs();else if(e.key==='Home'){meet.i=0;drawMeet()}else if(e.key==='End'){meet.i=meet.n-1;drawMeet()}});
let tx=null;$('#meet').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('#meet').addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50){stepMeet(dx<0?1:-1);tx=null}},{passive:true});

function tsv(rows){return rows.map(r=>r.map(v=>String(v==null?'':v).replace(/[\t\n\r]+/g,' ')).join('\t')).join('\n')}

function rp(v){return num(String(v||'').replace(/\./g,'').replace(',','.'))}
function fmtRp(n){if(!n)return 'Rp 0';if(n>=1e9)return 'Rp '+(n/1e9).toLocaleString('id-ID',{maximumFractionDigits:2})+' M';if(n>=1e6)return 'Rp '+(n/1e6).toLocaleString('id-ID',{maximumFractionDigits:1})+' jt';return 'Rp '+Math.round(n).toLocaleString('id-ID')}
function lastQuote(l){return (l.quotes||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0]}
function leadPrice(l){const q=lastQuote(l);return rp(q&&q.price)||rp(l.price)}
function leadVal(l){return num(l.vol)*1000*leadPrice(l)}
function ordVal(o){return num(o.ton)*1000*rp(o.price)}
function allOrders(){const o=[];leadsArr().forEach(l=>(l.orders||[]).forEach(x=>o.push(Object.assign({lead:l},x))));return o}
function allQuotes(){const o=[];leadsArr().forEach(l=>(l.quotes||[]).forEach(x=>o.push(Object.assign({lead:l},x))));return o}
function allSamples(){const o=[];leadsArr().forEach(l=>(l.samples||[]).forEach(x=>o.push(Object.assign({lead:l},x))));return o}
function lastTouch(l){let d=l.created||'';Object.values(S.acts).forEach(a=>{if(a.leadId===l.id&&a.date>d)d=a.date});['quotes','samples','orders'].forEach(k=>(l[k]||[]).forEach(x=>{if((x.date||'')>d)d=x.date}));return d}
function stBadge(map,k){const s=map[k]||Object.values(map)[0];return `<span class="badge" style="color:${s[1]};background:${s[2]}">${s[0]}</span>`}
function alertsList(){const t=TODAY(),out=[];
  allQuotes().forEach(q=>{if(!['terkirim','revisi'].includes(q.status)||!ACTIVE.includes(q.lead.stage))return;
    if(q.valid&&q.valid<t)out.push({l:q.lead,i:'📄',c:'#d6453d',m:`Penawaran ${q.grade||''} kedaluwarsa ${fmtD(q.valid)} — perbarui harga`});
    else if(q.valid&&q.valid<=addDays(2))out.push({l:q.lead,i:'📄',c:'#c98a06',m:`Penawaran ${q.grade||''} habis ${fmtD(q.valid)} — tanyakan keputusan`});

  allSamples().forEach(s=>{if(s.result==='menunggu'&&s.date&&s.date<=addDays(-5))out.push({l:s.lead,i:'🧪',c:'#0f8a99',m:`Sampel ${s.grade||''} dikirim ${fmtD(s.date)} — tanyakan hasil uji`})});
  allOrders().forEach(o=>{if(o.status==='lunas'||!o.due)return;
    if(o.due<t)out.push({l:o.lead,i:'💰',c:'#d6453d',m:`Tagihan PO ${o.poNo||''} lewat jatuh tempo ${fmtD(o.due)} · ${fmtRp(ordVal(o))}`});
    else if(o.due<=addDays(3))out.push({l:o.lead,i:'💰',c:'#c98a06',m:`Tagihan PO ${o.poNo||''} jatuh tempo ${fmtD(o.due)} · ${fmtRp(ordVal(o))}`})});
  leadsArr().filter(l=>ACTIVE.includes(l.stage)).forEach(l=>{const d=lastTouch(l);if(d&&d<=addDays(-14))out.push({l,i:'🧊',c:'#8a97ab',m:`Tidak ada kontak sejak ${fmtD(d)} — jangan sampai dingin`})});

  return out}

document.addEventListener('click',e=>{
  if(e.target.closest('a'))return;

  if(t.hasAttribute('data-close'))return closeSheet();

const TOPICS=[
{id:'dasar',i:'🧱',t:'Aluminium & ingot: dasar-dasar',m:6,b:`
<p>Aluminium dipakai luas karena <b>ringan</b> (massa jenis ±2,7 g/cm³, kira-kira sepertiga baja), <b>tahan korosi</b>, mudah dicetak, dan bisa <b>didaur ulang berulang kali</b> tanpa kehilangan sifatnya.</p>
<h4>Apa itu ingot?</h4>
<p>Ingot adalah logam dalam bentuk batangan/blok hasil cor yang <b>dijual sebagai bahan baku</b>. Pelanggan meleburnya lagi di tungku, lalu mencetaknya menjadi komponen. Jadi yang kita jual bukan produk jadi, melainkan bahan baku produksi pelanggan.</p>
<h4>Primer vs sekunder</h4>
<ul><li><b>Aluminium primer</b>: dari bauksit → alumina → elektrolisis. Butuh listrik sangat besar. Di Indonesia produsen aluminium primer adalah Inalum.</li>
<li><b>Aluminium sekunder</b>: dari daur ulang scrap yang dilebur, dibersihkan, lalu komposisinya diatur. Jauh lebih hemat energi. Banyak ingot paduan untuk die casting (mis. ADC12) dibuat dari aluminium sekunder.</li></ul>
<h4>Kenapa harus paduan (alloy)?</h4>
<ul><li><b>Si (silikon)</b> → logam cair lebih encer (mampu alir), mudah mengisi cetakan, susut lebih kecil.</li>
<li><b>Cu (tembaga)</b> → menambah kekuatan & kekerasan, mudah dimesin; tapi menurunkan ketahanan korosi.</li>
<li><b>Mg (magnesium)</b> → menambah kekuatan, memungkinkan perlakuan panas (heat treatment).</li>
<li><b>Fe (besi)</b> → biasanya dibatasi maksimum. Di die casting, sedikit Fe membantu mencegah logam lengket ke cetakan; tapi Fe tinggi membuat getas.</li></ul>
<div class="callout">💡 Inti tugas sales: memahami <b>proses & komponen pelanggan</b>, lalu mencocokkan dengan <b>grade</b> yang tepat.</div>`},
{id:'kode',i:'🔤',t:'Membaca kode grade & standar',m:5,b:`
<h4>Standar Jepang (JIS) — paling umum di Indonesia</h4>
<ul><li><b>ADC</b> = <i>Aluminium Die Casting</i> (JIS H 5302). Contoh: ADC12, ADC10, ADC1.</li>
<li><b>AC</b> = <i>Aluminium Casting</i> untuk cetak gravitasi/pasir/tekanan rendah (JIS H 5202). Contoh: AC4B, AC2B, AC4CH.</li>
<li>Standar <b>ingot</b>-nya terpisah (JIS H 2118 untuk die casting, JIS H 2211 untuk casting) dan biasanya <b>sedikit lebih ketat</b> dari standar produk corannya.</li></ul>
<h4>Standar Amerika (AA / ASTM)</h4>
<ul><li>Tiga angka + desimal. Akhiran <b>.0</b> = produk cor, <b>.1 / .2</b> = ingot. Contoh: <b>A356.2</b> = ingot untuk paduan A356.</li></ul>
<h4>Standar Eropa (EN)</h4>
<ul><li>Ditulis dengan unsur: <b>AlSi9Cu3(Fe)</b>, <b>AlSi7Mg0,3</b>.</li></ul>
<h4>Padanan yang sering disebut</h4>
<ul><li>ADC12 ≈ A383 ≈ AlSi11Cu3(Fe)</li><li>ADC10 ≈ A380</li><li>AC4CH ≈ A356 ≈ AlSi7Mg0,3</li></ul>
<div class="callout">⚠️ "Setara" ≠ identik. Selalu bandingkan <b>batas komposisi</b> yang diminta pelanggan dengan spesifikasi produk perusahaan.</div>`},
{id:'proses',i:'🏭',t:'Bagaimana pelanggan memakai ingot',m:6,b:`
<h4>1. High Pressure Die Casting (HPDC)</h4>
<p>Logam cair disuntikkan ke cetakan baja dengan tekanan tinggi. Cepat, cocok untuk produksi massal & dinding tipis. Grade umum: <b>ADC12, ADC10, ADC1</b>.</p>
<p>Contoh produk: crankcase & cover mesin motor, housing transmisi, rumah komponen elektronik.</p>
<h4>2. Gravity / Low Pressure / Sand Casting</h4>
<p>Logam dituang dengan gravitasi atau tekanan rendah. Grade umum: <b>AC4B, AC2B, AC4CH / A356</b>.</p>
<p>Contoh: <b>velg</b> (A356, umumnya low pressure + heat treatment T6), cylinder head, komponen yang butuh kekuatan & keuletan.</p>
<h4>3. Ekstrusi & rolling</h4>
<p>Memakai <b>billet</b> atau slab, bukan ingot cor paduan. Kalau prospek butuh billet, catat sebagai peluang produk lain.</p>
<h4>Yang dipedulikan pelanggan</h4>
<ul><li><b>Konsistensi komposisi</b> antar pengiriman.</li><li><b>Kebersihan</b> logam: sedikit oksida/inklusi & gas → porositas rendah, reject rendah.</li><li>Kadar <b>Fe</b> & unsur pengotor.</li><li><b>Ketepatan kirim</b> (produksi mereka tidak boleh berhenti).</li><li>Harga, termin, dokumen.</li></ul>
<div class="callout">💡 Pelanggan biasanya mencampur ingot baru dengan <b>scrap internal</b> (runner, reject). Tanyakan rasio campurannya — ini memengaruhi spek ingot yang mereka butuhkan.</div>`},
{id:'kualitas',i:'🔬',t:'Kualitas, spesifikasi & dokumen',m:6,b:`
<h4>Dokumen kualitas</h4>
<ul><li><b>COA / mill certificate</b>: hasil uji komposisi per lot/heat, biasanya dari <b>spektrometer (OES)</b>.</li><li><b>Nomor lot/heat</b> pada ingot → bisa ditelusuri bila ada masalah.</li></ul>
<h4>Unsur yang sering diperiksa</h4>
<ul><li><b>Si & Cu</b> harus di dalam rentang.</li><li><b>Fe, Zn, Mn, Ni, Pb, Sn</b> di bawah batas maksimum.</li><li>Untuk A356: <b>Mg</b> & Fe sangat rendah.</li></ul>
<h4>Istilah teknis penting</h4>
<ul><li><b>Sludge factor</b> (untuk die casting) = Fe + 2×Mn + 3×Cr. Makin tinggi, makin berisiko timbul endapan keras di tungku.</li>
<li><b>Porositas</b>: rongga di produk karena gas/udara terperangkap → produk bocor/reject.</li>
<li><b>Degassing</b>: proses membuang gas hidrogen dari logam cair.</li>
<li><b>Dross</b>: kerak oksida di permukaan logam cair; makin banyak, makin besar kehilangan logam.</li></ul>
<h4>Kalau ada komplain kualitas</h4>
<ol><li>Dengarkan, catat nomor lot, minta data spektro & foto/sampel.</li><li>Libatkan tim QC perusahaan — jangan menjanjikan kompensasi sendiri.</li><li>Ingat: alat spektro tiap pabrik bisa berbeda kalibrasi.</li></ol>`},
{id:'harga',i:'💰',t:'Harga & komersial',m:5,b:`
<h4>Apa yang menggerakkan harga</h4>
<ul><li>Harga aluminium dunia di <b>LME</b> (London Metal Exchange), dalam USD/ton — bergerak setiap hari.</li><li>Untuk ingot paduan sekunder: juga harga <b>scrap</b>, silikon, tembaga.</li><li><b>Kurs</b> USD/IDR.</li></ul>
<h4>Cara harga ditawarkan</h4>
<ul><li>Biasanya <b>Rp/kg</b>. Perjelas: <b>sudah/belum PPN</b>, <b>franco</b> (diantar sampai pelanggan) atau <b>loco / ex-works</b> (diambil di pabrik).</li><li><b>Masa berlaku</b> penawaran pendek karena harga bergerak.</li><li><b>Termin</b>: cash/CBD, 30/45/60 hari. Termin panjang = risiko & biaya modal lebih besar → perlu persetujuan finance (limit kredit).</li></ul>
<h4>Hitung cepat</h4>
<p>Nilai = <b>ton × 1.000 × harga Rp/kg</b>.<br>Contoh: 20 ton × Rp 40.000/kg = <b>Rp 800 juta</b>.</p>
<div class="callout">⚠️ Jangan menjanjikan harga, diskon, atau termin di luar kewenangan. Pastikan persetujuan atasan dulu.</div>`},
{id:'pelanggan',i:'🎯',t:'Peta pelanggan & industri',m:5,b:`
<h4>Industri pemakai ingot paduan</h4>
<ul><li>Otomotif & sepeda motor (komponen die casting)</li><li>Velg / roda</li><li>Peralatan rumah tangga</li><li>Elektronik & kelistrikan (housing, heat sink)</li><li>Pompa, mesin, fitting</li><li>Pengecoran umum (foundry) & trader</li></ul>
<h4>Siapa yang terlibat di perusahaan pelanggan</h4>
<ul><li><b>Purchasing</b> — harga, termin, jadwal.</li><li><b>QC / engineering</b> — spek & persetujuan sampel.</li><li><b>Produksi</b> — kelancaran lebur & hasil cor.</li><li><b>Owner / direktur</b> — keputusan akhir untuk supplier baru.</li><li><b>Finance</b> — pembayaran.</li></ul>
<h4>Tipe pelanggan</h4>
<ul><li><b>OEM / tier-1 / tier-2</b>: spek ketat, proses approval panjang, volume stabil.</li><li><b>Pengecoran kecil–menengah</b>: sensitif harga, keputusan cepat.</li><li><b>Trader</b>: beli untuk dijual lagi, fokus harga & ketersediaan.</li></ul>
<div class="callout">💡 Catat semua kontak beserta perannya di Sales Hub (menu Kontak di detail lead).</div>`},
{id:'jual',i:'🤝',t:'Teknik jual B2B',m:6,b:`
<h4>Alur penjualan</h4>
<p>Riset → kontak pertama → kunjungan & kualifikasi → sampel/trial → penawaran → negosiasi → PO → kirim & tagih → <b>repeat order</b>.</p>
<h4>Pertanyaan kualifikasi</h4>
<ul><li>Grade & spek apa yang dipakai sekarang?</li><li>Berapa ton per bulan? Rutin atau sesekali?</li><li>Supplier saat ini siapa? Apa yang kurang?</li><li>Siapa yang menyetujui supplier baru? Bagaimana prosesnya?</li><li>Termin & cara pembayaran yang biasa?</li><li>Kapan biasanya order / kontrak diperbarui?</li></ul>
<h4>Jual nilai, bukan cuma harga</h4>
<ul><li>Konsistensi kualitas → reject pelanggan turun.</li><li>Ketersediaan & ketepatan kirim.</li><li>Dukungan teknis & respon cepat.</li><li>Dokumen lengkap & rapi.</li></ul>
<h4>Etika</h4>
<ul><li>Jangan menjelekkan kompetitor.</li><li>Jaga kerahasiaan harga & data pelanggan lain.</li><li>Janji hanya yang bisa ditepati.</li></ul>`}

/* =================== GOALS =================== */
const GMET={ton:['Deal / PO','ton'],po_rp:['Nilai PO','Rp'],deal:['Jumlah deal','deal'],leads:['Leads baru','leads'],visits:['Kunjungan','kunjungan'],acts:['Aktivitas','aktivitas'],quotes:['Penawaran terkirim','penawaran'],learn:['Materi dipelajari','materi']};
function goalsArr(){return (S.cfg.goals||[]).slice().sort((a,b)=>(a.done?1:0)-(b.done?1:0)||(a.due||'9').localeCompare(b.due||'9'))}
function goalProg(g){
  const s=g.start||'0000',e=g.due||'9999',inR=d=>d&&d>=s&&d<=e;let cur=0,tgt=num(g.target)||0;
  if(g.kind==='auto')switch(g.metric){
    case 'ton':cur=allOrders().filter(o=>inR(o.date)).reduce((a,o)=>a+num(o.ton),0)+leadsArr().filter(l=>l.stage==='deal'&&inR(l.dealDate)&&!(l.orders||[]).length).reduce((a,l)=>a+num(l.vol),0);break;
    case 'po_rp':cur=allOrders().filter(o=>inR(o.date)).reduce((a,o)=>a+ordVal(o),0);break;
    case 'deal':cur=leadsArr().filter(l=>l.stage==='deal'&&inR(l.dealDate)).length;break;
    case 'leads':cur=leadsArr().filter(l=>inR(l.created)).length;break;
    case 'visits':cur=actsArr().filter(a=>a.type==='kunjungan'&&inR(a.date)).length;break;
    case 'acts':cur=actsArr().filter(a=>inR(a.date)).length;break;
    case 'quotes':cur=allQuotes().filter(q=>inR(q.date)).length;break;
    case 'learn':cur=TOPICS.filter(t=>(L_().read||{})[t.id]).length;tgt=tgt||TOPICS.length;break}
  else if(g.kind==='check'){const c=g.checklist||[];cur=c.filter(x=>x.d).length;tgt=c.length}
  else cur=num(g.cur);
  const p=tgt?Math.min(100,cur/tgt*100):0,t=TODAY();
  let st;if(g.done||p>=100)st=['Tercapai 🎉','#1f9d6b','#e3f6ee'];else if(g.due&&g.due<t)st=['Terlewat','#d6453d','#fdeaea'];
  else if(g.start&&g.due&&g.start<=t){const tot=Math.max(1,(pd(g.due)-pd(g.start))/864e5),el=(pd(t)-pd(g.start))/864e5;st=p>=el/tot*100-10?['Sesuai jalur','#2f6fde','#e8f0fd']:['Tertinggal','#c98a06','#fdf4dd']}
  else st=['Berjalan','#6b7689','#eef0f4'];
  return {cur,tgt,p,st}}
function gUnit(g){return g.kind==='auto'?(GMET[g.metric]||['-',''])[1]:g.kind==='check'?'langkah':(g.unit||'')}
function gFmt(g,v){return g.kind==='auto'&&g.metric==='po_rp'?fmtRp(v):fmtN(v)+(gUnit(g)==='%'?'%':' '+gUnit(g))}
function goalCard(g,compact){const r=goalProg(g),days=g.due?Math.round((pd(g.due)-pd(TODAY()))/864e5):null;
  return `<div class="card goal" style="${g.done?'opacity:.7':''}"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;cursor:pointer" data-gedit="${esc(g.id)}">
  <div style="min-width:0"><div style="font-weight:800;font-size:14.5px">${esc(g.title)}</div><div class="tip" style="margin-top:2px">${g.kind==='auto'?'Otomatis · '+(GMET[g.metric]||['-',''])[0]:g.kind==='check'?'Checklist':'Manual'}${g.due?` · ${days>=0?days+' hari lagi':'s.d. '+fmtD(g.due)}`:''}</div></div>
  <span class="badge" style="color:${r.st[1]};background:${r.st[2]}">${r.st[0]}</span></div>
  <div class="prog" style="height:9px;margin-top:10px"><i style="width:${r.p}%;background:${r.p>=100?'var(--green)':'var(--accent)'}"></i></div>
  <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-top:5px;font-weight:700"><span>${gFmt(g,r.cur)} / ${gFmt(g,r.tgt)}</span><span style="color:var(--muted)">${Math.round(r.p)}%</span></div>
  ${!compact&&g.kind==='check'?`<div style="margin-top:8px">${(g.checklist||[]).map((c,i)=>`<label class="chk"><input type="checkbox" data-gc="${esc(g.id)}|${i}" ${c.d?'checked':''}> <span>${esc(c.t)}</span></label>`).join('')}</div>`:''}

function lrData(){const r=lrRange(),N=notesArr().filter(n=>n.date>=r.from&&n.date<=r.to).reverse();
  const by={};N.forEach(n=>{(by[n.topic||'Lainnya']=by[n.topic||'Lainnya']||[]).push(n)});
  const sc=N.filter(n=>+n.score),avg=sc.length?sc.reduce((a,n)=>a+(+n.score),0)/sc.length:0;
  const L=L_();return {r,N,by,avg,days:new Set(N.map(n=>n.date)).size,read:TOPICS.filter(t=>(L.read||{})[t.id]).length,best:(L.quiz||{}).best,
    q:N.filter(n=>n.question),ap:N.filter(n=>n.apply),weak:N.filter(n=>+n.score&&+n.score<=2)}}
function buildLearnReport(){const d=lrData(),r=d.r;
  let s=`*LAPORAN PEMBELAJARAN*\nNama: ${S.cfg.name||'-'}\nKepada: ${S.cfg.spv||'-'}\nPeriode: ${r.lbl} (${fmtD(r.from)} – ${fmtD(r.to)})\n\n`;
  s+=`*1. Ringkasan*\n- Catatan belajar: ${d.N.length} (${d.days} hari belajar)\n`;
  if(d.N.length)s+=`- Topik: ${Object.keys(d.by).map(k=>`${k} (${d.by[k].length})`).join(', ')}\n`;
  if(d.avg)s+=`- Rata-rata pemahaman: ${fmtN(d.avg)} / 5\n`;
  s+=`- Materi dasar produk: ${d.read}/${TOPICS.length} selesai\n`;
  s+=`\n*2. Yang saya pelajari*\n`;
  if(!d.N.length)s+='- Belum ada catatan di periode ini\n';
  else{let i=0;Object.keys(d.by).forEach(k=>{s+=`\n_${k}_\n`;d.by[k].forEach(n=>{i++;s+=`${i}. [${fmtD(n.date)}] *${n.title}*\n   ${String(n.learned||'').replace(/\n+/g,'\n   ')}\n   Sumber: ${n.source||'-'}${+n.score?` · Pemahaman ${n.score}/5`:''}\n`})})}
  s+=`\n*3. Penerapan di lapangan*\n`+(d.ap.length?d.ap.map(n=>`- ${n.title}: ${n.apply}`).join('\n'):'-')+'\n';
  s+=`\n*4. Pertanyaan / perlu bimbingan*\n`+(d.q.length?d.q.map(n=>`- ${n.question} (${n.title})`).join('\n'):'-')+'\n';
  if(d.weak.length)s+=`\n*5. Topik yang perlu diperdalam*\n`+d.weak.map(n=>`- ${n.title} (pemahaman ${n.score}/5)`).join('\n')+'\n';
  s+=`\n*Rencana belajar berikutnya*\n${S.cfg.learnPlan||'-'}\n`;
  return s}
function rLrep(){const d=lrData();
  $('#v-lrep').innerHTML=`<div class="chips" style="margin-top:14px">${[['minggu','Minggu ini'],['bulan','Bulan ini'],['semua','Semua']].map(([k,n])=>`<button class="chip ${lrPeriod===k?'on':''}" data-lp="${k}">${n}</button>`).join('')}</div>
  <div class="kpis" style="margin-top:6px"><div class="kpi"><div class="l">Catatan</div><div class="v">${d.N.length}</div><div class="s">${d.days} hari belajar</div></div><div class="kpi"><div class="l">Rata-rata paham</div><div class="v">${d.avg?fmtN(d.avg):'–'}<span style="font-size:13px;color:var(--muted)"> /5</span></div><div class="s">${d.q.length} pertanyaan terbuka</div></div></div>
  ${d.N.length?`<div class="chart" style="margin-top:12px"><div class="cap">Catatan per topik</div>${hbars(Object.keys(d.by).map(k=>({l:k,v:d.by[k].length,c:tcol(k)})),'')}</div>`:''}
  <h2>🗓️ Rencana belajar berikutnya</h2>
  <div class="card"><div class="f"><label class="full">Akan dipelajari selanjutnya<textarea id="lpIn" placeholder="Contoh: spesifikasi resmi semua produk perusahaan, cara hitung harga franco, ikut kunjungan QC ke pelanggan velg…">${esc(S.cfg.learnPlan)}</textarea></label></div><div class="btns"><button class="btn sm n" id="saveLp">Simpan rencana</button></div></div>
  <h2>📄 Laporan pembelajaran</h2>
  <textarea class="rep" readonly>${esc(buildLearnReport())}</textarea>
  <div class="btns"><button class="btn p" id="cpLr">📋 Salin laporan</button><button class="btn n" data-meet="belajar">🎤 Presentasikan</button></div>
  ${!d.N.length?'<div class="tip">Belum ada catatan di periode ini — tulis dulu di <b>Catatan saya</b>.</div>':''}`}
function learnSlides(){const d=lrData(),out=[],nm=esc(S.cfg.name||'Sales'),spv=S.cfg.spv?' · untuk '+esc(S.cfg.spv):'';
  out.push(cover('Laporan<br>Pembelajaran','Pengembangan diri sales',`${nm}${spv}<br>${d.r.lbl} · ${fmtD(d.r.from)} – ${fmtD(d.r.to)}`));
  out.push(slide('Ringkasan','Ringkasan belajar',`<div class="mk">${tile('Catatan belajar',d.N.length,d.days+' hari belajar')}${tile('Topik dipelajari',Object.keys(d.by).length,'dari '+NTOP.length+' topik')}${tile('Rata-rata pemahaman',d.avg?fmtN(d.avg):'–','/ 5',d.avg?d.avg/5*100:null,'#1f9d6b')}
    ${tile('Materi dasar produk',d.read,'/ '+TOPICS.length,d.read/TOPICS.length*100,'#2f6fde')}${tile('Hari belajar',d.days,'hari dalam periode ini')}${tile('Pertanyaan terbuka',d.q.length,'perlu bimbingan')}</div>`));
  const all=[];Object.keys(d.by).forEach(k=>d.by[k].forEach(n=>all.push(n)));
  for(let i=0;i<Math.max(1,all.length);i+=6){const ch=all.slice(i,i+6);
    out.push(slide('Materi','Yang saya pelajari'+(all.length>6?` (${i/6+1}/${Math.ceil(all.length/6)})`:''),ch.length?ch.map(n=>`<div class="srow"><div class="ic" style="background:${tcol(n.topic)}22">📘</div><div style="min-width:0;flex:1"><div class="c" style="white-space:normal">${esc(n.title)} <span style="font-weight:600;color:#8a97ab;font-size:1.2cqw">· ${esc(n.topic)}</span></div><div class="d" style="white-space:nowrap">${esc(String(n.learned||'').replace(/\n+/g,' · '))}</div></div>${+n.score?`<span class="bd" style="background:#fdf4dd;color:#c98a06">${n.score}/5</span>`:''}</div>`).join(''):'<div class="sempty">Belum ada catatan belajar di periode ini.</div>'))}
  out.push(slide('Tindak lanjut','Penerapan & pertanyaan',`<div class="two"><div><div class="sub">Rencana penerapan</div>${listOrEmpty(d.ap.map(n=>sRow('🎯',n.title,n.apply)),6,'—')}</div><div><div class="sub">Pertanyaan untuk atasan</div>${listOrEmpty(d.q.map(n=>sRow('❓',n.title,n.question)),6,'—')}</div></div>`));
  out.push(slide('Berikutnya','Rencana belajar berikutnya',`<div class="note" style="height:100%">${esc(S.cfg.learnPlan||'—\n(isi di Belajar → Laporan belajar)')}</div>`));
  return out}

  setInterval(()=>{const L=$('#login');if(L.hidden)return;k=(k+1)%N.length;
    L.querySelectorAll('.lbs').forEach((el,i)=>el.classList.toggle('on',i===k));L.querySelectorAll('.ldots i').forEach((el,i)=>el.classList.toggle('on',i===k));
    const n=$('#lcapN');n.style.opacity=0;setTimeout(()=>{n.textContent=N[k];n.style.opacity=1},500)},6500)})();
$('#login').addEventListener('click',e=>{const a=e.target.closest('[data-lgto]');if(a){e.preventDefault();setLg(a.dataset.lgto)}});
$('#login').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();doLogin()}});
go('home');
initDb();
